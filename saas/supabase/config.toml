# Supabase CLI configuration (supabase.com/docs/guides/local-development/cli/config).
project_id = "webconstructor"

[api]
port = 54321
# the "private" schema never goes here: its functions must not be callable through the API
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/painel/", "http://localhost:5173/painel/senha"]

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

# Calls without a Supabase JWT: Asaas (webhook) and the sites Worker (forms) authenticate with their own secret;
# the AI proxy reads the token from the x-api-key header, as the editor's assistant sends it, and checks it with getUser;
# the overlay function is public and only returns published customizations, by key.
[functions.asaas-webhook]
verify_jwt = false

[functions.form-submit]
verify_jwt = false

[functions.ai-proxy]
verify_jwt = false

# the sites' wc-runtime.js fetches the published customization without login (site-editor)
[functions.overlay]
verify_jwt = false

# the published apps' database: the sites Worker forwards /_api/* with the platform secret; visitors identify
# themselves with the site's member token, not with the Supabase JWT
[functions.site-data]
verify_jwt = false
